<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia Study</title>
<meta name="description" content="Turn your class PDFs into a daily study quiz. Free, private, runs in your browser.">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f2a44'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='%23f6f1e7' font-family='Georgia,serif'>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Trivia Study</h1>
      <p id="dateLine"></p>
    </div>
    <div class="row" style="gap:8px">
      <div class="streak" title="Days in a row you finished your daily set"><span>🔥</span><span id="streakNum">0</span></div>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">⚙︎</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="review">Review<span class="badge" id="reviewBadge" hidden></span></button>
    <button role="tab" data-tab="practice">Practice</button>
    <button role="tab" data-tab="classes">Classes</button>
  </nav>

  <main id="view"></main>

  <footer>
    Your PDFs and progress stay in this browser. <button id="aboutBtn">How it works</button> · <button id="themeBtn">Theme</button><br>
    <span class="credit">Coded with Claude (Opus 5.5) by Anthropic</span>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="gen.js"></script>
<script src="app.js"></script>
</body>
</html>
