<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia Study</title>
<meta name="description" content="Turn your class PDFs into a daily study quiz. Free, private, runs in your browser.">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Trivia Study">
<meta property="og:description" content="Turn your class notes into a daily quiz. Upload PDFs, get questions every day. Free, no account.">
<meta property="og:url" content="https://taziz05.github.io/trivia-study/">
<meta property="og:image" content="https://taziz05.github.io/trivia-study/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://taziz05.github.io/trivia-study/preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img class="logo" src="logo.png" alt="">
      <div>
        <h1>Trivia Study</h1>
        <p id="dateLine"></p>
      </div>
    </div>
    <div class="row" style="gap:8px">
      <div class="streak" title="Days in a row you finished your daily set"><span>🔥</span><span id="streakNum">0</span></div>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">⚙︎</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="review">Review<span class="badge" id="reviewBadge" hidden></span></button>
    <button role="tab" data-tab="practice">Practice</button>
    <button role="tab" data-tab="classes">Classes</button>
  </nav>

  <main id="view"></main>

  <footer>
    Your PDFs and progress stay in this browser. <button id="aboutBtn">How it works</button> · <button id="themeBtn">Theme</button><br>
    <span class="credit">Coded with Claude (Opus 5.5) by Anthropic</span>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="gen.js"></script>
<script src="app.js"></script>
</body>
</html>
